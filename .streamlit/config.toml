[theme]
base = "dark"
primaryColor = "#0A84FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#F5F5F7"
linkColor = "#0A84FF"
borderColor = "#2C2C2E"
codeBackgroundColor = "#1C1C1E"
dataframeHeaderBackgroundColor = "#2C2C2E"
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Roboto, sans-serif"
baseRadius = "10px"
showSidebarBorder = false
chartCategoricalColors = ["#0A84FF", "#30D158", "#FF9F0A", "#BF5AF2", "#FF375F", "#64D2FF", "#FFD60A", "#5E5CE6", "#AC8E68", "#66D4CF"]
chartSequentialColors = ["#123A66", "#134B85", "#115DA6", "#0E70C8", "#0A84FF", "#3598FF", "#5EABFF", "#82BFFF", "#A0D3FF", "#BDE6FF"]

[theme.sidebar]
backgroundColor = "#2C2C2E"
secondaryBackgroundColor = "#3A3A3C"
borderColor = "#48484A"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
